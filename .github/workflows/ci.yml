name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --dir packages/sdk pack --pack-destination ../../release-artifacts
      - run: pnpm --dir packages/asset-generator pack --pack-destination ../../release-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: package-candidates
          path: release-artifacts/*.tgz
